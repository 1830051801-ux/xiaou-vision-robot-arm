# XiaoU reference deployment profile.
#
# This file contains the declared software/hardware contract and measured
# workspace bounds from the field workbook. Camera intrinsics and TCP offsets
# are intentionally null until they are supplied by the installation-specific
# calibration record. The public Pi hardware_calibration.json remains locked.

project: xiaou-vision-robot-arm
profile: pi5-f407-six-axis

camera:
  device: /dev/video0
  resolution: [640, 480]
  fps: 30
  color_order: rgb
  intrinsics: null
  distortion: null
  calibration_source: installation_record_required

workspace_mm:
  x: [80.0, 430.0]
  y: [60.0, 380.0]
  safe_z: 80.0
  source: user_supplied_field_workbook_20260923

arm:
  joint_count: 6
  angle_unit: deg
  speed_unit: deg_s
  acceleration_unit: deg_s2
  effective_limits_deg:
    min: [-165.0, -125.0, -135.0, -175.0, -85.0, -175.0]
    max: [165.0, 125.0, 135.0, 175.0, 115.0, 175.0]
  speed_limits_deg_s: [180.0, 150.0, 170.0, 240.0, 200.0, 260.0]
  acceleration_limits_deg_s2: [360.0, 300.0, 340.0, 480.0, 400.0, 520.0]
  interpolation_period_ms: 10

control:
  pid:
    # Gains are loaded from the controller calibration record at deployment.
    # Keeping them unset prevents a public profile from becoming a write-ready
    # motor configuration.
    position: {kp: null, ki: null, kd: null}
    velocity: {kp: null, ki: null, kd: null}
  trajectory:
    min_duration_ms: 1
    max_duration_ms: 10000
    default_duration_ms: 2000

transport:
  uart: /dev/serial0
  baud: 115200
  framing: 8N1
  flow_control: none
  crc: CRC-16/MODBUS
  can_bus: CAN1

models:
  detector: raspberry_pi/models/xiaou_objects_gpu_deep.onnx
  detector_classes: 12
  policy: raspberry_pi/runtime/decision/transformer_policy_safety_final_20260813.int8.onnx
  policy_input: RGB64_instruction_state
  policy_action_horizon: 12

runtime:
  motion_enabled: false
  ros2_mode: dry_run
  hardware_execution_enabled: false
