[pytest]
# The files under robot_ai/ named *_test.py are executable hardware demos, not
# unit tests.  ROS2 build/install/log trees also contain Linux symlinks that
# Windows cannot stat.  Keep the ordinary Python test entry point deterministic
# and reserve ROS2 integration checks for the dedicated colcon/launch workflow.
testpaths = tests
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    ros2_ws/build
    ros2_ws/install
    ros2_ws/log
python_files = test_*.py
