name: Feature request
description: Propose a scoped improvement with an acceptance test.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem and proposed change
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include an offline test or a clearly named hardware validation step.
    validations:
      required: true
